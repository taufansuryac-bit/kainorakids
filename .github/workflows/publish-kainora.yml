name: Publish Kainora

on:
  push:
    branches: [admin-production]

permissions:
  contents: read

concurrency:
  group: kainora-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'taufansuryac-bit/kainorakids'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check admin and storefront
        run: |
          npm run test:admin
          npm run test:shop
          npm run test:journal
          npm run test:seo
      - run: npm run build:cloudflare
      - name: Publish production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 1fcb8f0ab4e65926e20f078c55c4fd9e
        run: npx --yes wrangler@4.153.0 pages deploy dist --project-name kainorakids --branch main --commit-hash "$GITHUB_SHA"
